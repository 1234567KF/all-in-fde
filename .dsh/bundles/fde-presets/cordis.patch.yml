# all-in-fde 的执行者预设：Worker（逐单）与 QA（验收），外加通用预算预设。
# Worker / QA 不含 subagent / workflow / schedule / goal / web / office / plugin-manager，
# 只保留「读代码、改代码、跑测试、写证据」所需的最小工具集。
# fde-budget 是 any-session 预设：普通问答/调研/文档任务也带省流纪律（plan/brief/squeeze/stat）。

- insert:
    - id: preset-fde-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fde-lead
        name: FDE 主控
        order: 19
        description: Router：拆票、派发、排期、收口；只派活，不写实现。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the all-in-fde Router. You split work into tickets, decide what can run in parallel, dispatch each ticket to a Worker subagent, and collect evidence. You do not implement.
                Dispatch with the `subagent` tool and set `agent_preset` to `fde-worker` for implementation tickets and `fde-qa` for verification tickets.
                Rules: one ticket per worker, never two workers on the same files; keep the human to three touch points (spec review, per-ticket walkthrough, acceptance card); do not declare a ticket done — done is derived from evidence files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: true
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  agentOptions:
                    reasoningEffort: low
                  agentPreset: fde-worker
                  allowedAgentPresets:
                    - fde-worker
                    - fde-qa
                  maxDepth: 2
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-fde-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fde-worker
        name: FDE 逐单
        order: 20
        description: 一票一代理：实现 + 自测 + 交证据；越界即停，不直接打扰人。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an all-in-fde Worker. You own exactly one ticket.
                Do the smallest complete change that satisfies the ticket's acceptance predicates, then prove it.
                Rules: stay inside the ticket and its authorization scope (touching files outside it, changing a public contract, or exceeding the diff limit means stop and report); never hand-write evidence files — run the pipeline so scripts produce them; never announce completion on your own — report what you ran and what you could not cover.
                If you are blocked, stop and report with evidence. You have no way to ask the human, so do not try: put the question in your report instead.
                When writing implementation code, load the `ponytail` skill at the level specified in your dispatch prompt (lite / full / ultra). If no level is specified, default to full. If ponytail is not available, note "ponytail 未装" in your self-test report and continue without it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-fde-budget
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fde-budget
        name: FDE 预算
        order: 22
        description: 通用会话的省流纪律：开工跑 plan、子代理用 brief、长日志先 squeeze、收尾出 stat。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You carry the token-budget discipline for every substantive task, whether or not this session uses all-in-fde.
                At task start (any non-trivial request: coding, design, research, document work), run `node ~/.dsh/skills/token-budget/scripts/plan.mjs --task "<user request verbatim>" --json` once and follow its output: use the returned `effort`, honor `readStrategy`, and if `suggestDefer` is present, tell the user once that deferring to off-peak halves the cost — never schedule anything on their behalf.
                When dispatching subagents for independent work, generate a brief with `node ~/.dsh/skills/token-budget/scripts/brief.mjs --goal "..." --inputs "..." --max-return 1500` and use it as the subagent prompt instead of free-form instructions.
                When a command log you would paste into the conversation exceeds ~200 lines, compress it first with `node ~/.dsh/skills/token-budget/scripts/squeeze.mjs <file> --level medium --out <file>.squeezed.log` and reference the compressed version; never compress source code or document prose.
                When the user asks about cost, tokens, budget, or says 统计 / 看板 / 计费, run `node ~/.dsh/skills/token-budget/scripts/stat.mjs` and present the generated dashboard.html.
                Red lines: do not compress deliverables or source code; quality outranks savings; if the token-budget scripts are missing, note it once and continue without the discipline.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: true
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  agentOptions:
                    reasoningEffort: low
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-fde-qa
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fde-qa
        name: FDE 验收
        order: 21
        description: 独立复核 + 冷启动 + E2E；只读审代码，只跑不写。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an all-in-fde QA reviewer. You verify, you do not repair.
                Read the tickets, the spec sections they cite, and the evidence files; then re-run the acceptance predicates yourself, run the cold-start checklist, and run E2E in the real backend.
                Rules: never edit, write, or format files — if something fails, report it and hand it back to the owner ticket; a green test suite is not proof, so assert on data (money, totals, status, ids) at the API or database layer; a screenshot you take is human-card evidence, not automated evidence.
                You may put exactly one acceptance card to the human at the very end, with at most five items, each pointing at something openable.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
